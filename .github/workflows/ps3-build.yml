name: CloudMoon PS3 PKG
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloudmoon-pkg:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build native WebRTC stack and PS3 HEN package
        run: make cloudmoon-pkg
      - name: Upload CloudMoon PS3 PKG
        uses: actions/upload-artifact@v4
        with:
          name: cloudmoon-ps3-hen-pkg
          path: vendor/PS3-Moonlight/build/*.pkg
          if-no-files-found: error
          retention-days: 14
