name: CloudMoon PS3 PKG
on:
  push:
    branches: [main, ui-redesign-safe-base]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloudmoon-pkg:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install image preparation dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
      - name: Test CloudMoon signaling, WebSocket and session protocol
        run: make host-test
      - name: Build native WebRTC stack and PS3 HEN package
        run: make cloudmoon-pkg
      - name: Validate PS3 package before upload
        run: |
          PKG="$(find vendor/PS3-Moonlight/build -maxdepth 1 -type f -name '*.pkg' -print -quit)"
          test -n "$PKG"
          python3 scripts/validate-ps3-pkg.py --pkg "$PKG" --stage vendor/PS3-Moonlight/build/pkg --elf vendor/PS3-Moonlight/cloudmoon-ps3.elf
      - name: Upload CloudMoon PS3 PKG
        uses: actions/upload-artifact@v4
        with:
          name: cloudmoon-ps3-hen-pkg
          path: vendor/PS3-Moonlight/build/*.pkg
          if-no-files-found: error
          retention-days: 14
