name: PS3 build checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run portable protocol and transport tests
        run: make host-test
  prototype-pkg:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Compile CloudMoon modules and package PS3 shell
        run: make prototype-pkg
      - name: Upload prototype PKG (not yet CloudMoon-streaming capable)
        uses: actions/upload-artifact@v4
        with:
          name: cloudmoon-ps3-prototype-pkg-not-streaming
          path: vendor/PS3-Moonlight/build/*.pkg
          if-no-files-found: error
          retention-days: 7
