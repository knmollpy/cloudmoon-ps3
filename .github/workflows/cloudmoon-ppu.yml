name: CloudMoon PS3 PPU build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'cmake/**'
      - 'Makefile'
      - 'Makefile.host-test'
      - 'assets/**'
      - '.gitmodules'
      - '.github/workflows/cloudmoon-ppu.yml'

permissions:
  contents: read

concurrency:
  group: cloudmoon-ppu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ppu:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository and nested dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build curl git pkg-config python3

      - name: Run host-side protocol regression tests
        run: make host-test

      - name: Build CloudMoon PPU libraries and PS3 PKG
        run: |
          set -o pipefail
          make cloudmoon-pkg 2>&1 | tee cloudmoon-ppu-build.log

      - name: Validate PS3 package before upload
        run: |
          PKG="$(find vendor/PS3-Moonlight/build -maxdepth 1 -type f -name '*.pkg' -print -quit)"
          test -n "$PKG"
          python3 scripts/validate-ps3-pkg.py --pkg "$PKG" --stage vendor/PS3-Moonlight/build/pkg --elf vendor/PS3-Moonlight/cloudmoon-ps3.elf

      - name: Upload PKG and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudmoon-ps3-ppu-build-${{ github.run_number }}
          path: |
            vendor/PS3-Moonlight/build/*.pkg
            vendor/PS3-Moonlight/cloudmoon-ps3.elf
            build/**/*.a
            cloudmoon-ppu-build.log
          if-no-files-found: warn
          retention-days: 14
