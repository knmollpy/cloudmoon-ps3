name: CloudMoon PS4 UI and protocol tests

on:
  push:
    branches: [ps4-port]
    paths:
      - "ps4/**"
      - ".github/workflows/ps4-ui-test.yml"
  pull_request:
    paths:
      - "ps4/**"
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure host test build
        run: cmake -S ps4 -B build-ps4-host -DCM_UI_BUILD_TESTS=ON

      - name: Compile CloudMoon UI, protocol and session modules
        run: cmake --build build-ps4-host --parallel 2

      - name: Run all smoke tests
        run: ctest --test-dir build-ps4-host --output-on-failure
